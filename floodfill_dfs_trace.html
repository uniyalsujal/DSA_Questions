<div style="font-family: -apple-system, Arial, sans-serif; display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px; background:#fafafa; border:1px solid #ddd; border-radius:12px; max-width:560px; margin:0 auto;">

  <h3 style="margin:0; font-size:16px; font-weight:600; color:#222;">floodFill DFS trace — image=[[1,1,1],[1,1,0],[1,0,1]], sr=1, sc=1, color=2</h3>

  <div id="grid" style="display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,64px); gap:6px;"></div>

  <div style="display:flex; gap:16px; font-size:12px; color:#555;">
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#B5D4F4;margin-right:4px;"></span>color 1 (original)</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#9FE1CB;margin-right:4px;"></span>color 2 (new)</span>
    <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#D3D1C7;margin-right:4px;"></span>color 0</span>
  </div>

  <div style="width:100%; background:#fff; border:1px solid #e0e0e0; border-radius:10px; padding:14px 18px; box-sizing:border-box;">
    <div style="font-family:'Courier New',monospace; font-size:13px; margin-bottom:6px; color:#111;" id="call-line"></div>
    <div style="font-size:14px; color:#555;" id="desc-line"></div>
  </div>

  <div style="display:flex; align-items:center; gap:12px;">
    <button id="prev" style="padding:6px 16px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:13px;">Prev</button>
    <span style="font-size:13px; color:#555; min-width:70px; text-align:center;" id="counter"></span>
    <button id="next" style="padding:6px 16px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:13px;">Next</button>
  </div>
</div>

<script>
(function(){
  const base = [[1,1,1],[1,1,0],[1,0,1]];
  function clone(g){ return g.map(r=>r.slice()); }

  const steps = [];
  let g = clone(base);

  function push(row,col,depth,action,desc){
    if(action === 'set'){ g = clone(g); g[row][col] = 2; }
    steps.push({row,col,depth,action,desc,grid:clone(g)});
  }

  push(1,1,0,'set','image[1][1] == 1 (original color) -> set to 2');
  push(0,1,1,'set','up: image[0][1] == 1 -> set to 2');
  push(-1,1,2,'oob','up: row -1 is out of bounds -> return');
  push(1,1,2,'skip','down: image[1][1] is already 2 (not original color) -> return');
  push(0,0,2,'set','left: image[0][0] == 1 -> set to 2');
  push(-1,0,3,'oob','up: row -1 is out of bounds -> return');
  push(1,0,3,'set','down: image[1][0] == 1 -> set to 2');
  push(0,0,4,'skip','up: image[0][0] is already 2 -> return');
  push(2,0,4,'set','down: image[2][0] == 1 -> set to 2');
  push(1,0,5,'skip','up: image[1][0] is already 2 -> return');
  push(3,0,5,'oob','down: row 3 is out of bounds -> return');
  push(2,-1,5,'oob','left: col -1 is out of bounds -> return');
  push(2,1,5,'diff','right: image[2][1] == 0, not original color -> return');
  push(1,-1,3,'oob','left: col -1 is out of bounds -> return');
  push(1,1,3,'skip','right: image[1][1] is already 2 -> return');
  push(0,-1,2,'oob','left: col -1 is out of bounds -> return');
  push(0,1,2,'skip','right: image[0][1] is already 2 -> return');
  push(0,2,1,'set','right: image[0][2] == 1 -> set to 2');
  push(-1,2,2,'oob','up: row -1 is out of bounds -> return');
  push(1,2,2,'diff','down: image[1][2] == 0, not original color -> return');
  push(0,1,2,'skip','left: image[0][1] is already 2 -> return');
  push(0,3,2,'oob','right: col 3 is out of bounds -> return');
  push(2,1,0,'diff','down: image[2][1] == 0, not original color -> return');
  push(1,0,0,'skip','left: image[1][0] is already 2 -> return');
  push(1,2,0,'diff','right: image[1][2] == 0, not original color -> return');

  let i = 0;
  const colorBg = {0:'#D3D1C7', 1:'#B5D4F4', 2:'#9FE1CB'};
  const colorText = {0:'#444441', 1:'#0C447C', 2:'#085041'};

  function render(){
    const s = steps[i];
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    for(let r=0;r<3;r++){
      for(let c=0;c<3;c++){
        const v = s.grid[r][c];
        const cell = document.createElement('div');
        const isCurrent = (r===s.row && c===s.col);
        cell.style.cssText = 'display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;border-radius:8px;background:'+colorBg[v]+';color:'+colorText[v]+';'+(isCurrent ? 'box-shadow:0 0 0 3px #E24B4A;' : 'box-shadow:0 0 0 1px #ccc;');
        cell.textContent = v;
        gridEl.appendChild(cell);
      }
    }
    const indent = '\u00A0\u00A0'.repeat(s.depth);
    document.getElementById('call-line').textContent = indent + 'dfs(row=' + s.row + ', col=' + s.col + ')';
    document.getElementById('desc-line').textContent = s.desc;
    document.getElementById('counter').textContent = (i+1) + ' / ' + steps.length;
    document.getElementById('prev').disabled = i===0;
    document.getElementById('next').disabled = i===steps.length-1;
  }

  document.getElementById('prev').onclick = () => { if(i>0){ i--; render(); } };
  document.getElementById('next').onclick = () => { if(i<steps.length-1){ i++; render(); } };
  render();
})();
</script>
